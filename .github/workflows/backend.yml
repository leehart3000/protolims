name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # Cancel superseded pull request runs, but never interrupt a deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGION: europe-west2
  IMAGE: europe-west2-docker.pkg.dev/protolims/protolims/api:${{ github.sha }}

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: protolims
          POSTGRES_PASSWORD: protolims_dev
          POSTGRES_DB: protolims_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U protolims -d protolims_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PROTOLIMS_DATABASE_URL: postgresql+psycopg://protolims:protolims_dev@127.0.0.1:5433/protolims_test

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check migrations match models
        run: uv run alembic check

      - name: Check migrations can be reversed
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -v

  deploy-staging:
    name: Deploy to staging
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: protolims
          workload_identity_provider: projects/516499981468/locations/global/workloadIdentityPools/github/providers/protolims-repo
          service_account: protolims-deployer@protolims.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Run migrations on staging
        working-directory: backend
        run: |
          DB_URL="$(gcloud secrets versions access latest --secret=staging-database-url-direct)"
          echo "::add-mask::$DB_URL"
          PROTOLIMS_DATABASE_URL="$DB_URL" uv run --locked --no-dev alembic upgrade head

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy protolims-api-staging \
            --image="$IMAGE" --region="$REGION" --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe protolims-api-staging \
            --region="$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$URL/health/db"

name: Deploy to production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: europe-west2
  IMAGE: europe-west2-docker.pkg.dev/protolims/protolims/api:${{ github.sha }}

jobs:
  deploy-production:
    name: Deploy API to production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: protolims
          workload_identity_provider: projects/516499981468/locations/global/workloadIdentityPools/github-production/providers/protolims-tags
          service_account: protolims-deployer-production@protolims.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Check this commit was built and tested for staging
        run: |
          if ! gcloud artifacts docker images describe "$IMAGE" --quiet > /dev/null; then
            echo "::error::No image for commit $GITHUB_SHA. Tag a commit that staging has deployed (use 'just release')."
            exit 1
          fi

      - name: Run migrations on production
        run: |
          gcloud run jobs deploy migrate-production \
            --image="$IMAGE" \
            --region="$REGION" \
            --service-account=protolims-migrator-production@protolims.iam.gserviceaccount.com \
            --set-secrets=PROTOLIMS_DATABASE_URL=production-database-url-direct:latest \
            --command=alembic \
            --args=upgrade,head \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet
          gcloud run jobs execute migrate-production --region="$REGION" --wait

      # Public access (--allow-unauthenticated) was granted once, by hand.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy protolims-api-production \
            --image="$IMAGE" \
            --region="$REGION" \
            --service-account=protolims-api-production@protolims.iam.gserviceaccount.com \
            --set-secrets=PROTOLIMS_DATABASE_URL=production-database-url:latest,PROTOLIMS_PROXY_KEY=production-proxy-key:latest \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=2 \
            --quiet

      - name: Smoke test
        run: |
          URL="$(gcloud run services describe protolims-api-production \
            --region="$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$URL/health/db"

  deploy-web:
    name: Deploy website to production
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler deploy --env production

      - name: Smoke test
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for path in / /api/v1/projects; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "https://protolims.org$path")"
            echo "$path: $status"
            if [ "$status" != 200 ]; then
              echo "::error::Expected 200 from $path, got $status"
              exit 1
            fi
          done

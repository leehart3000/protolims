[project]
name = "protolims-api"
version = "0.1.0"
description = "ProtoLIMS backend API (FastAPI)"
license = "AGPL-3.0-only"
readme = "README.md"
authors = [
    { name = "Lee", email = "264464762+leehart3000@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.149.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle (style errors and warnings)
    "F",       # pyflakes (unused imports, undefined names)
    "I",       # isort (import order)
    "B",       # flake8-bugbear (likely bugs)
    "UP",      # pyupgrade (modern Python syntax)
    "SIM",     # flake8-simplify
    "N",       # pep8-naming
    "RUF",     # Ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["protolims_api"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:"]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: (^|/)pnpm-lock\.yaml$
      - id: check-toml
      - id: check-json
        exclude: (^|/)tsconfig[^/]*\.json$
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
        files: ^backend/

      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format
        language: system
        types: [python]
        files: ^backend/

      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy src tests'
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false
